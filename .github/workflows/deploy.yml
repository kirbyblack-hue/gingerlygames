name: Supabase ile Mobil Siteyi Otomatik Yenile
on:
  push:
    branches:
      - main
  workflow_dispatch: # El ile test etmek için buton açar

jobs:
  build:
    runs-on: ubuntu-24.04 # Node.js 24 ve Ubuntu uyarılarını engellemek için sabitlendi
    steps:
    - name: Kodlari Klonla
      uses: actions/checkout@v4 # En güncel Node sürümüne güncellendi

    - name: Python Kur
      uses: actions/setup-python@v5 # En güncel sürüme güncellendi
      with:
        python-version: '3.10'

    - name: Gerekli Kutuphaneleri Yukle
      run: pip install requests

    - name: Supabase'den Verileri Cek ve HTML Uret
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      run: |
        python build_site.py || (echo "HATA: Python scripti calisirken bir sorun olustu!" && exit 1)
